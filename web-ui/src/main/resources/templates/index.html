<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bãi Xe Thoong Minh - ESP32</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        .temp-container { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .temp-display { font-size: 44px; font-weight: bold; color: #2c3e50; }
        .unit { font-size: 22px; color: #7f8c8d; }

        .btn-group { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-open { background-color: #28a745; color: white; }
        .btn-open:hover { background-color: #218838; }
        .btn-close { background-color: #dc3545; color: white; }
        .btn-close:hover { background-color: #c82333; }
        .btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        .status-box { margin-top: 20px; font-size: 14px; color: #555; }
        .countdown { font-weight: bold; color: #d9534f; }

        /* [THÊM MỚI] Khung hiển thị số chỗ trống */
        .slots-container { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .slots-display { font-size: 44px; font-weight: bold; color: #28a745; }
        .slots-display.full { color: #dc3545; }
        .btn-out { background-color: #f39c12; color: white; }
        .btn-out:hover { background-color: #d68910; }
        .btn-group { flex-wrap: wrap; }
        .btn-group .btn-close { flex-basis: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h2>Điều Khiển Bãi Xe Tự Động</h2>

    <div class="temp-container">
        <div>Nhiệt độ bãi xe hiện tại</div>
        <div class="temp-display"><span id="tempVal">--</span> <span class="unit">°C</span></div>
    </div>

    <!-- [THÊM MỚI] Hiển thị số chỗ trống -->
    <div class="slots-container">
        <div>Số chỗ trống</div>
        <div class="slots-display" id="slotsBox">
            <span id="slotsVal">--</span> / <span id="slotsTotal">--</span>
        </div>
    </div>

    <div class="btn-group">
        <!-- [THAY ĐỔI] "MỞ CỬA" thành "MỞ CỬA VÀO", gửi action open_in -->
        <button id="btnOpen" class="btn btn-open" onclick="sendAction('open_in')">MỞ CỬA VÀO</button>
        <!-- [THÊM MỚI] Nút MỞ CỬA RA, gửi action open_out -->
        <button id="btnOpenOut" class="btn btn-out" onclick="sendAction('open_out')">MỞ CỬA RA</button>
        <button id="btnClose" class="btn btn-close" onclick="sendAction('close')" disabled>ĐÓNG NGAY</button>
    </div>

    <div class="status-box">
        <div id="statusMsg">Trạng thái: Cửa đang ĐÓNG</div>
        <div id="timerMsg" style="display:none; margin-top: 8px;">
            Tự động đóng sau: <span class="countdown" id="countNum">10</span> giây
        </div>
    </div>
</div>

<script>
    // Gọi về chính web-ui (cùng origin). Web-ui sẽ gắn Bearer token từ cookie
    // rồi chuyển tiếp qua API Gateway.
    const BASE_URL = "/api/devices";

    let countdownInterval = null;
    let secondsLeft = 10;

    // [THÊM MỚI] Cập nhật số chỗ trống lên giao diện
    function updateSlots(available, total) {
        if (available === undefined || available === null) return;
        document.getElementById('slotsVal').innerText = available;
        if (total !== undefined && total !== null) {
            document.getElementById('slotsTotal').innerText = total;
        }
        document.getElementById('slotsBox').classList.toggle('full', available <= 0);
    }

    async function sendAction(actionName) {
        const statusEl = document.getElementById('statusMsg');
        // [THAY ĐỔI] thông báo theo 3 loại action
        const labels = { open_in: "MỞ CỬA VÀO", open_out: "MỞ CỬA RA", close: "ĐÓNG" };
        statusEl.innerText = "Đang gửi lệnh " + labels[actionName] + "...";

        try {
            const res = await fetch(`${BASE_URL}/control-servo`, {
                method: 'POST',
                credentials: 'same-origin',   // gửi cookie access_token / refresh_token
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: actionName })
            });

            if (res.status === 401) {
                statusEl.innerText = "Phiên đăng nhập hết hạn, đang chuyển về trang đăng nhập...";
                setTimeout(() => window.location.href = "/", 1500);
                return;
            }
            if (res.status === 403) {
                statusEl.innerText = "Bạn không có quyền điều khiển (cần ADMIN hoặc STAFF)!";
                return;
            }

            // [THÊM MỚI] 409 = hết chỗ (cửa vào) hoặc bãi trống hoàn toàn (cửa ra)
            if (res.status === 409) {
                const data = await res.json();
                statusEl.innerText = data.error;
                updateSlots(data.available_slots);
                return;
            }

            if (res.ok) {
                const data = await res.json();       // [THÊM MỚI]
                updateSlots(data.available_slots);   // [THÊM MỚI] cập nhật số chỗ ngay
                if (actionName === 'close') {
                    setDoorUIClose();
                } else {
                    setDoorUIOpen(actionName);       // [THAY ĐỔI] truyền loại cửa vào/ra
                }
            } else {
                statusEl.innerText = "Lỗi khi gửi lệnh tới Server!";
            }
        } catch (err) {
            statusEl.innerText = "Không thể kết nối Server!";
            console.error(err);
        }
    }

    function setDoorUIOpen(actionName) {
        // [THAY ĐỔI] hiện đúng loại cửa đang mở
        const dir = actionName === 'open_out' ? "RA" : "VÀO";
        document.getElementById('statusMsg').innerText = "Trạng thái: Đã gửi lệnh MỞ CỬA " + dir + " (Chờ ESP32 nhận)";
        document.getElementById('btnOpen').disabled = true;
        document.getElementById('btnOpenOut').disabled = true;   // [THÊM MỚI]
        document.getElementById('btnClose').disabled = false;
        document.getElementById('timerMsg').style.display = "block";

        clearInterval(countdownInterval);
        secondsLeft = 10;
        document.getElementById('countNum').innerText = secondsLeft;

        countdownInterval = setInterval(() => {
            secondsLeft--;
            document.getElementById('countNum').innerText = secondsLeft;
            if (secondsLeft <= 0) {
                setDoorUIClose();
            }
        }, 1000);
    }

    function setDoorUIClose() {
        clearInterval(countdownInterval);
        document.getElementById('statusMsg').innerText = "Trạng thái: Cửa đang ĐÓNG";
        document.getElementById('btnOpen').disabled = false;
        document.getElementById('btnOpenOut').disabled = false;  // [THÊM MỚI]
        document.getElementById('btnClose').disabled = true;
        document.getElementById('timerMsg').style.display = "none";
    }

    async function fetchTemperature() {
        try {
            const res = await fetch(`${BASE_URL}/temperature`, {
                credentials: 'same-origin'
            });
            if (res.status === 401) {
                window.location.href = "/";
                return;
            }
            if (res.ok) {
                const data = await res.json();
                if (data.temperature !== null && data.temperature !== undefined) {
                    document.getElementById('tempVal').innerText = data.temperature;
                }
                // [THÊM MỚI] đồng bộ số chỗ trống từ server
                updateSlots(data.available_slots, data.total_slots);
            }
        } catch (err) {
            console.error("Lỗi đọc nhiệt độ:", err);
        }
    }

    // Tự động cập nhật nhiệt độ và số chỗ trống mỗi 5 giây
    setInterval(fetchTemperature, 5000);
    fetchTemperature(); // [THÊM MỚI] gọi ngay khi mở trang để thấy số chỗ liền
</script>

</body>
</html>
