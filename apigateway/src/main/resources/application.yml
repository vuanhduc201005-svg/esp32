server:
  port: 8081

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/dducwsjvbe
  data:
    redis:
      port: 6379
      host: localhost
      password: dyl2509201005
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10000
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/auths/**
              metadata:
                response-timeout: 10000
                connect-timeout: 5000
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
            - id: fishfeeder
              uri: lb://FISHFEEDER
              predicates:
                - Path=/api/devices/**
              metadata:
                response-timeout: 10000
                connect-timeout: 5000
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

